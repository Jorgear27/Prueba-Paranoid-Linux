name: "CMake Build with Conan and Submodule"
description: "Executes a compilation."

runs:
  using: "composite"
  steps:

    - name: Set up Python environment
      shell: bash
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install conan

    - name: Install dependencies with Conan
      shell: bash
      run: |
        source venv/bin/activate
        conan profile detect --force
        conan install . --build=missing --settings=build_type=Debug

    - name: Compile
      shell: bash
      run: |
        echo "Running command: cmake .. -DCMAKE_TOOLCHAIN_FILE=./build/Debug/generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Debug -DRUN_COVERAGE=TRUE && make -j$(nproc)"
        mkdir -p build
        cd build
        cmake .. -DCMAKE_TOOLCHAIN_FILE=./build/Debug/generators/conan_toolchain.cmake -DCMAKE_BUILD_TYPE=Debug -DRUN_COVERAGE=TRUE && make -j$(nproc)
        cd ..

    - name: Build Go Backer Server
      shell: bash
      run: |
        if [ ! -f backer/src/go.mod ]; then
          echo "Error: backer/src/go.mod not found"
          pwd
          ls -la
          exit 1
        fi

        go -C backer/src mod download
        CGO_ENABLED=0 go -C backer/src build -trimpath -ldflags="-s -w" -o ../backer ./cmd/
        echo "Backer binary built successfully ($(du -h backer/backer | cut -f1))"

    - name: Build Courier simulator
      shell: bash
      run: |
        cd courier/sim
        cmake -B build -DCMAKE_BUILD_TYPE=Debug \
          -DEMPLOYEE_ID='"E001"' \
          -DMQTT_BROKER_ADDR='"127.0.0.1"' \
          -DMQTT_BROKER_PORT=1883
        cmake --build build -j$(nproc)
