# =============================================================================
# Courier Rugged System — Zephyr project configuration
# Target: ESP32 (esp32_devkitc_wroom)
# =============================================================================

# -----------------------------------------------------------------------------
# Networking — WiFi + TCP/IP stack
# -----------------------------------------------------------------------------
CONFIG_WIFI=y
CONFIG_ESP32_WIFI=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_DHCPV4=y
CONFIG_DNS_RESOLVER=y

# Network buffer pool — sized for MQTT + JSON payloads
CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# -----------------------------------------------------------------------------
# MQTT
# -----------------------------------------------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_CLEAN_SESSION=y
# Keep-alive interval in seconds (half the broker's session timeout)
CONFIG_MQTT_KEEPALIVE=60
# Maximum MQTT packet size: enough for a route list of ~20 stops
CONFIG_MQTT_LIB_TLS_MAX_FRAGMENT_LEN=0

# -----------------------------------------------------------------------------
# JSON
# -----------------------------------------------------------------------------
CONFIG_JSON_LIBRARY=y

# -----------------------------------------------------------------------------
# LVGL — embedded GUI
# -----------------------------------------------------------------------------
CONFIG_LVGL=y
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BTN=y
CONFIG_LV_USE_CONT=y
CONFIG_LV_USE_STYLE=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
# Display driver — SPI-connected ILI9341 (320x240)
CONFIG_DISPLAY=y
CONFIG_DISPLAY_ILI9341=y
CONFIG_SPI=y

# -----------------------------------------------------------------------------
# GPIO — buttons
# -----------------------------------------------------------------------------
CONFIG_GPIO=y

# -----------------------------------------------------------------------------
# Heap & stacks
# -----------------------------------------------------------------------------
CONFIG_HEAP_MEM_POOL_SIZE=32768
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# -----------------------------------------------------------------------------
# Threads
# -----------------------------------------------------------------------------
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_NAME=y

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y

# -----------------------------------------------------------------------------
# NVS — non-volatile storage for employee_id and WiFi credentials
# -----------------------------------------------------------------------------
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# -----------------------------------------------------------------------------
# RTC / Uptime for timestamps
# -----------------------------------------------------------------------------
CONFIG_CLOCK_CONTROL=y

# -----------------------------------------------------------------------------
# Assertions (disable in production to save flash)
# -----------------------------------------------------------------------------
CONFIG_ASSERT=y
